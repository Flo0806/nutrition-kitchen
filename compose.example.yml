# Production setup on the server. Copy to compose.yml next to a filled .env.
services:
  app:
    image: ghcr.io/flo0806/nutrition-kitchen:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # The SQLite database and the pictures; back up this volume.
    volumes:
      - data:/app/.data

volumes:
  data:
